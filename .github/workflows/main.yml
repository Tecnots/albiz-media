name: Deploy to Vercel
 
on:
  push:
    tags:
      - 'v*'
 
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_IGNORE_SCRIPTS: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PNPM_IGNORE_SCRIPTS: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Enable pnpm
        run: npm install -g pnpm
 
      - name: Install Vercel CLI
        run: npm install -g vercel@latest dotenv-cli
 
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
 
      - name: Install dependencies
        run: |
          pnpm config set enable-pre-post-scripts true
          pnpm config set ignore-scripts false
          pnpm install --frozen-lockfile

      - name: Rebuild packages
        run: pnpm rebuild
 
      - name: Run database migrations
        run: |
          vercel env pull .env.migrate --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          # Swap transaction pooler (6543) for session pooler (5432) — advisory locks work on session pooler
          sed -i 's|:6543/|:5432/|g' .env.migrate
 
          # Recover any migration stuck in failed state by clearing then re-baselining.
          # The call_logs table and its FK constraints already exist so re-running the SQL
          # would fail on duplicate constraints. This marks it applied without running it.
          dotenv -e .env.migrate -- npx prisma migrate resolve --rolled-back 20260508180000_outbound_call_logs 2>&1 || true
          dotenv -e .env.migrate -- npx prisma migrate resolve --applied 20260508180000_outbound_call_logs 2>&1 || true
 
          # Baseline migrations that were already in production before the call_logs feature
          # (all migrations dated before 20260508). On subsequent deploys these fail silently.
          for dir in prisma/migrations/2*/; do
            migration=$(basename "$dir")
            migration_date="${migration:0:8}"
            if [ "$migration_date" -lt "20260508" ]; then
              dotenv -e .env.migrate -- npx prisma migrate resolve --applied "$migration" 2>&1 || true
            fi
          done
 
          # Deploy all pending migrations (20260508 and later)
          dotenv -e .env.migrate -- npx prisma migrate deploy
          rm -f .env.migrate
 
      - name: Build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
 
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
 
      - name: Summary
        run: |
          echo "### Deployed \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY